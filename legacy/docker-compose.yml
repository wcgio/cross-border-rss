services:
  # ── RSSHub：把大量站点转成 RSS（36氪、微博、Telegram、各官方博客等）──
  rsshub:
    image: diygod/rsshub:latest
    container_name: rsshub
    restart: unless-stopped
    ports:
      - "1200:1200"          # 调试用，跑通后可删掉只走内网
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: "redis://redis:6379/"
      # 反爬较严的源可按需开启 puppeteer，默认不需要
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: rsshub-redis
    restart: unless-stopped
    volumes:
      - ./data/redis:/data

  # ── feedmaker：把雨果/亿邦等没有 RSS 的列表页转成 RSS ──
  feedmaker:
    build: ./feedmaker
    container_name: feedmaker
    restart: unless-stopped
    ports:
      - "8000:8000"          # 调试用，跑通后可删
    environment:
      FEEDMAKER_CACHE_TTL: "600"
      FEEDMAKER_MAX_ITEMS: "30"
    # 改 sites.yml 后无需重新 build，挂载进去即可热改（改完重启容器生效）
    volumes:
      - ./feedmaker/sites.yml:/app/sites.yml:ro
      - ./data/digest:/app/digest:ro       # feedmaker 在 /digest.xml 提供每日日报

  # ── digest：生成"每日日报"RSS，由 cron 触发的一次性任务 ──
  # 运行：docker compose run --rm digest
  digest:
    build: ./feedmaker
    profiles: ["tools"]                    # 默认不随 up 启动，仅按需 run
    env_file: ./push/.env
    environment:
      DIGEST_FILE: "/app/digest/digest.xml"
    volumes:
      - ./data/digest:/app/digest          # 可写，写出 digest.xml
    command: ["python", "digest.py"]
    depends_on:
      - freshrss

  # ── FreshRSS：聚合器，统一订阅 + 阅读 + 给推送脚本提供 API ──
  freshrss:
    image: freshrss/freshrss:latest
    container_name: freshrss
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      TZ: Asia/Shanghai
      CRON_MIN: "*/30"       # 每 30 分钟自动刷新所有订阅
    volumes:
      - ./data/freshrss:/var/www/FreshRSS/data
    depends_on:
      - rsshub
      - feedmaker

# data/ 会自动创建，建议整目录纳入你现有的备份
