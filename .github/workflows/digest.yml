name: daily-digest

on:
  # 不用 GitHub schedule（整点常被延迟/丢弃）。改由 Cloudflare Worker 的 Cron Trigger
  # 在北京时间 12:00 准点调 workflow_dispatch 触发，见 cron-trigger/。
  workflow_dispatch:

permissions:
  contents: write # commit 产物回仓库
  models: read    # 调用 GitHub Models

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  digest:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # 完整历史，保证 pull --rebase 可靠
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GOTIFY_URL: ${{ secrets.GOTIFY_URL }}
          GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
        run: python -m src.pipeline
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs data/seen.json
          git diff --cached --quiet || git commit -m "chore: daily digest $(date -u +%F)"
          git pull --rebase
          git push
      - name: Deploy Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ea310efac77a0a5ecf70c13fae407fbc
        run: npx wrangler pages deploy docs --project-name cross-border-rss --branch main
      - name: Gotify on failure
        if: failure()
        env:
          GOTIFY_URL: ${{ secrets.GOTIFY_URL }}
          GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
        run: |
          curl -sf -X POST "$GOTIFY_URL/message" \
            -H "X-Gotify-Key: $GOTIFY_TOKEN" \
            -F title="跨境日报 workflow 失败" \
            -F message="run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -F priority=8 || true
